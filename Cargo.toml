[package]
name = "omarchy-power-policy"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt", "signal", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
strip = true
